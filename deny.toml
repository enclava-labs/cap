ignore = [
    { id = "RUSTSEC-2023-0071", reason = "No upstream fix (patched = []). rsa 0.9.10 reaches CAP via enclava-verifier (cfg(test)-only interop tests) and sqlx-mysql (unused DB backend). The only RsaPrivateKey/SigningKey references are amd.rs cfg(test) interop tests with ephemeral keys; shipped RSA code performs public-key operations only (PKCS#1 DER decode and hand-rolled modpow with a public exponent). Revisit before any RSA private-key use or when these dependencies drop rsa 0.9.x." },
