name: Build API Image

on:
  push:
    branches: ['main']
    tags: ['v*']
    paths:
    - '.github/workflows/api-image.yml'
    - 'Cargo.toml'
    - 'Cargo.lock'
    - 'crates/enclava-api/**'
    - 'crates/enclava-cli/platform-release.json'
    - 'crates/enclava-common/**'
    - 'crates/enclava-engine/**'
  pull_request:
    paths:
    - '.github/workflows/api-image.yml'
    - 'Cargo.toml'
    - 'Cargo.lock'
    - 'crates/enclava-api/**'
    - 'crates/enclava-cli/platform-release.json'
    - 'crates/enclava-common/**'
    - 'crates/enclava-engine/**'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/enclava-labs/enclava-api
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./crates/enclava-api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Set up Kustomize
        if: github.event_name != 'pull_request'
        uses: imranismail/setup-kustomize@v2

      - name: Render digest-pinned deploy manifest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          image_ref="ghcr.io/enclava-labs/enclava-api@${{ steps.build.outputs.digest }}"
          scripts/render-api-release-manifest.sh "${image_ref}" dist/enclava-api-deploy.yaml
          printf '%s\n' "${image_ref}" > dist/enclava-api-image.txt

      - name: Upload release manifest artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: enclava-api-release-manifest
          path: |
            dist/enclava-api-deploy.yaml
            dist/enclava-api-image.txt
