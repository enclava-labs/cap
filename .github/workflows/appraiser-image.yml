name: Build Appraiser Image

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Optional manual-* candidate tag"
        required: false
        type: string
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/appraiser-image.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/enclava-appraiser/**"
      - "crates/enclava-verifier/**"
      - "crates/enclava-common/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate manual image tag
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version_tag != ''
        env:
          VERSION_TAG: ${{ github.event.inputs.version_tag }}
        run: |
          if [[ ! "$VERSION_TAG" =~ ^manual-[a-z0-9][a-z0-9_.-]{0,119}$ ]]; then
            echo "::error::Manual image tags must match ^manual-[a-z0-9][a-z0-9_.-]{0,119}$."
            exit 1
          fi
      - id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/enclava-labs/enclava-appraiser
          tags: |
            type=sha,prefix=
            type=raw,value=${{ github.event.inputs.version_tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version_tag != '' }}
      - id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: crates/enclava-appraiser/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=appraiser
          cache-to: type=gha,mode=max,scope=appraiser
          provenance: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and verify digest
        env:
          IMAGE: ghcr.io/enclava-labs/enclava-appraiser
          DIGEST: ${{ steps.build.outputs.digest }}
          SIGNER_SUBJECT: https://github.com/${{ github.workflow_ref }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "${SIGNER_SUBJECT}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          mkdir -p dist
          printf '%s@%s\n' "${IMAGE}" "${DIGEST}" > dist/enclava-appraiser-image.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enclava-appraiser-image
          path: dist/enclava-appraiser-image.txt
