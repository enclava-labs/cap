name: Build enclava-init Image

on:
  push:
    branches: ['main']
    tags: ['v*']
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/enclava-common/**'
      - 'crates/enclava-init/**'
      - 'crates/enclava-wait-exec/**'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/enclava-common/**'
      - 'crates/enclava-init/**'
      - 'crates/enclava-wait-exec/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push enclava-init image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/enclava-labs/enclava-init
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=

      - name: Select build profile
        id: build_profile
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "profile=release" >> "$GITHUB_OUTPUT"
          else
            echo "profile=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./crates/enclava-init/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_PROFILE=${{ steps.build_profile.outputs.profile }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
