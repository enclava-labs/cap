name: Build enclava-init Image

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Optional manual-* candidate tag"
        required: false
        type: string
  push:
    branches: ['main']
    tags: ['v*']
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/enclava-common/**'
      - 'crates/enclava-init/**'
      - 'crates/enclava-wait-exec/**'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/enclava-common/**'
      - 'crates/enclava-init/**'
      - 'crates/enclava-wait-exec/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push enclava-init image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/enclava-labs/enclava-init
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=${{ github.event.inputs.version_tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version_tag != '' }}

      - name: Validate manual image tag
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version_tag != ''
        env:
          VERSION_TAG: ${{ github.event.inputs.version_tag }}
        run: |
          if [[ ! "$VERSION_TAG" =~ ^manual-[a-z0-9][a-z0-9_.-]{0,119}$ ]]; then
            echo "::error::Manual image tags must match ^manual-[a-z0-9][a-z0-9_.-]{0,119}$."
            exit 1
          fi

      - name: Select build profile
        id: build_profile
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "profile=release" >> "$GITHUB_OUTPUT"
          else
            echo "profile=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./crates/enclava-init/Dockerfile
          push: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_PROFILE=${{ steps.build_profile.outputs.profile }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Install cosign
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify pushed digest
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          IMAGE: ghcr.io/enclava-labs/enclava-init
          DIGEST: ${{ steps.build.outputs.digest }}
          SIGNER_SUBJECT: https://github.com/${{ github.workflow_ref }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "$SIGNER_SUBJECT" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
