name: CI

on:
  push:
    branches: ["main", "develop"]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-cli:
    name: Check enclava CLI compiles (${{ matrix.os-name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: windows
          - os: macos-latest
            os-name: macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check CLI
        run: cargo check --bin enclava

  test:
    name: Test Rust workspace
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libcryptsetup-dev clang libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run fmt check
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        # Database-backed tests share one PostgreSQL service and exercise
        # intentionally global provider fences. Serialize them so independent
        # fixtures cannot contend through that shared authority.
        run: cargo test --workspace -- --test-threads=1
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Run doctests
        run: cargo test --doc

      - name: Run appraiser API conformance
        run: |
          ENCLAVA_APPRAISER_BIND=127.0.0.1:18080 cargo run -q -p enclava-appraiser >/tmp/enclava-appraiser.log 2>&1 &
          appraiser_pid=$!
          trap 'kill "$appraiser_pid"' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/healthz >/dev/null && break
            sleep 1
          done
          python3 scripts/appraiser-conformance.py http://127.0.0.1:18080

  dependency-gates:
    name: Audit Rust dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo audit and cargo deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Run cargo audit
        # RUSTSEC-2023-0071 is transitive through sigstore/openidconnect and has
        # no fixed upstream path. cargo-deny records the same exception with
        # rationale in deny.toml.
        run: cargo audit --ignore RUSTSEC-2023-0071

      - name: Run cargo deny
        run: cargo deny check advisories sources

  build:
    name: Build all crates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libcryptsetup-dev clang libclang-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build workspace
        run: cargo build --workspace

      - name: Build release bins
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          cargo build --release --bin enclava-api
          cargo build --release --bin enclava
        env:
          ENCLAVA_PLATFORM_RELEASE_ROOT_PUBKEY_HEX: 5b9437adeaffbe8f41b13d96ed49d2f51cd6c266cd8ecc284b0552ec4912b8dd

      - name: Build prod-strict release path
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          cargo build --release -p enclava-common --features prod-strict
          cargo build --release -p enclava-engine --features prod-strict
          cargo build --release -p enclava-api --features prod-strict
          cargo build --release -p enclava-cli --features prod-strict
          cargo build --release -p enclava-init --features prod-strict
        env:
          ENCLAVA_PLATFORM_RELEASE_ROOT_PUBKEY_HEX: 5b9437adeaffbe8f41b13d96ed49d2f51cd6c266cd8ecc284b0552ec4912b8dd

      - name: Verify prod-strict rejects debug-only features
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          if cargo check --release -p enclava-engine --features prod-strict,testutil; then
            echo "enclava-engine prod-strict unexpectedly accepted testutil"
            exit 1
          fi
          if cargo check --release -p enclava-init --features prod-strict,luks-integration; then
            echo "enclava-init prod-strict unexpectedly accepted luks-integration"
            exit 1
          fi

  browser-verifier:
    name: Test verifier in headless browser
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.118 --locked

      - name: Build web verifier
        run: ./web/verifier/build.sh

      - name: Run checked-in browser fixture
        run: |
          python3 -m http.server 8000 >/tmp/enclava-verifier-http.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/web/verifier/test.html >/dev/null && break
            sleep 1
          done
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=30000 \
            --dump-dom http://127.0.0.1:8000/web/verifier/test.html > /tmp/enclava-verifier-dom.html
          if ! grep -E '<pre id="result">PASS [0-9a-f]{64}</pre>' /tmp/enclava-verifier-dom.html; then
            cat /tmp/enclava-verifier-dom.html
            cat /tmp/enclava-verifier-http.log
            exit 1
          fi
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=30000 \
            --dump-dom 'http://127.0.0.1:8000/web/verifier/test.html?reject=measurement&expected=FAIL&reason=SNP_MEASUREMENT_REJECTED' \
            > /tmp/enclava-verifier-rejected-dom.html
          grep -E '<pre id="result">PASS [0-9a-f]{64}</pre>' /tmp/enclava-verifier-rejected-dom.html
          for vector in \
            'snp_report:SNP_REPORT_SIGNATURE_INVALID' \
            'sigstore_material:SUPPLY_CHAIN_SIGNATURE_INVALID' \
            'provenance_oci_material:SUPPLY_CHAIN_SIGNATURE_INVALID'; do
            field="${vector%%:*}"
            reason="${vector#*:}"
            google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=30000 \
              --dump-dom "http://127.0.0.1:8000/web/verifier/test.html?mutate=${field}&expected=FAIL&reason=${reason}" \
              > "/tmp/enclava-verifier-${field}-dom.html"
            grep -E '<pre id="result">PASS [0-9a-f]{64}</pre>' "/tmp/enclava-verifier-${field}-dom.html"
          done
