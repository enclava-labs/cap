name: CI

on:
  push:
    branches: ["main", "develop"]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-cli:
    name: Build enclava CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            crt-static: -C target-feature=+crt-static
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.crt-static }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # Full build (not check) so linking and all target triples are exercised
      # before a tag starts the release workflow. Mirrors the release targets,
      # including static CRT on Windows.
      - name: Build CLI
        run: cargo build --bin enclava --target ${{ matrix.target }}

      # Runtime coverage for platform-specific code (Windows ACL
      # create/verify roundtrip, unix permission checks) — a compiling
      # release must not be the first time these execute.
      # x86_64-apple-darwin test binaries execute via Rosetta 2 on the arm64
      # runner; split onto macos-latest-intel if that ever stops holding.
      - name: Run CLI unit tests
        run: cargo test -p enclava-cli --target ${{ matrix.target }}

  test:
    name: Test Rust workspace
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libcryptsetup-dev clang libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run fmt check
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        # Database-backed tests share one PostgreSQL service and exercise
        # intentionally global provider fences. Serialize them so independent
        # fixtures cannot contend through that shared authority.
        run: cargo test --workspace -- --test-threads=1
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Run doctests
        run: cargo test --doc

      - name: Run appraiser API conformance
        run: |
          ENCLAVA_APPRAISER_BIND=127.0.0.1:18080 cargo run -q -p enclava-appraiser >/tmp/enclava-appraiser.log 2>&1 &
          appraiser_pid=$!
          trap 'kill "$appraiser_pid"' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/healthz >/dev/null && break
            sleep 1
          done
          python3 scripts/appraiser-conformance.py http://127.0.0.1:18080

  dependency-gates:
    name: Audit Rust dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo audit and cargo deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Run cargo audit
        # RUSTSEC-2023-0071 is transitive through sigstore/openidconnect and has
        # no fixed upstream path. cargo-deny records the same exception with
        # rationale in deny.toml.
        run: cargo audit --ignore RUSTSEC-2023-0071

      - name: Run cargo deny
        run: cargo deny check advisories sources

  build:
    name: Build all crates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libcryptsetup-dev clang libclang-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build workspace
        run: cargo build --workspace

      - name: Build release bins
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          cargo build --release --bin enclava-api
          cargo build --release --bin enclava
        env:
          # CI-compile-only: this job does not publish images. Prefer the repo
          # secret when set; otherwise use the well-known test fixture so
          # scheduled compile checks still run. Never a Dockerfile default.
          ENCLAVA_PLATFORM_RELEASE_ROOT_PUBKEY_HEX: ${{ secrets.ENCLAVA_PLATFORM_RELEASE_ROOT_PUBKEY_HEX || '5b9437adeaffbe8f41b13d96ed49d2f51cd6c266cd8ecc284b0552ec4912b8dd' }}

      - name: Build prod-strict release path
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          cargo build --release -p enclava-common --features prod-strict
          cargo build --release -p enclava-engine --features prod-strict
          cargo build --release -p enclava-api --features prod-strict
          cargo build --release -p enclava-cli --features prod-strict
          cargo build --release -p enclava-init --features prod-strict
        env:
          # CI-compile-only: this job does not publish images. Do not fall back
          # to the committed fixture; prod-strict rejects that root.
          ENCLAVA_PLATFORM_RELEASE_ROOT_PUBKEY_HEX: ${{ secrets.ENCLAVA_PLATFORM_RELEASE_ROOT_PUBKEY_HEX }}

      - name: Verify prod-strict rejects invalid platform-release roots
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          FIXTURE_ROOT: 5b9437adeaffbe8f41b13d96ed49d2f51cd6c266cd8ecc284b0552ec4912b8dd
        run: |
          # The fixture root must fail for every shipped binary crate.
          for crate in enclava-cli enclava-api; do
            if ENCLAVA_PLATFORM_RELEASE_ROOT_PUBKEY_HEX="$FIXTURE_ROOT" \
              cargo check --release -p "$crate" --features prod-strict > /tmp/prod-strict-fixture.log 2>&1; then
              cat /tmp/prod-strict-fixture.log
              echo "$crate prod-strict unexpectedly accepted the committed fixture root"
              exit 1
            fi
            if ! grep -q "prod-strict builds must not pin the committed fixture platform-release root" /tmp/prod-strict-fixture.log; then
              cat /tmp/prod-strict-fixture.log
              echo "$crate prod-strict fixture rejection did not report the expected compile error"
              exit 1
            fi
          done
          # Missing (unset and empty) and malformed roots must fail the
          # compile for both crates too, not defer to runtime errors.
          for crate in enclava-cli enclava-api; do
            for value in "" "not-a-key" "5b94"; do
              if ENCLAVA_PLATFORM_RELEASE_ROOT_PUBKEY_HEX="$value" \
                cargo check --release -p "$crate" --features prod-strict > /tmp/prod-strict-invalid.log 2>&1; then
                cat /tmp/prod-strict-invalid.log
                echo "$crate prod-strict unexpectedly accepted root: '$value'"
                exit 1
              fi
              if ! grep -q "prod-strict builds require ENCLAVA_PLATFORM_RELEASE_ROOT_PUBKEY_HEX to be set to a 32-byte hex pubkey" /tmp/prod-strict-invalid.log; then
                cat /tmp/prod-strict-invalid.log
                echo "$crate prod-strict invalid-root rejection did not report the expected compile error"
                exit 1
              fi
            done
            if env -u ENCLAVA_PLATFORM_RELEASE_ROOT_PUBKEY_HEX \
              cargo check --release -p "$crate" --features prod-strict > /tmp/prod-strict-unset.log 2>&1; then
              cat /tmp/prod-strict-unset.log
              echo "$crate prod-strict unexpectedly accepted an unset root"
              exit 1
            fi
          done

      - name: Verify prod-strict rejects debug-only features
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          if cargo check --release -p enclava-engine --features prod-strict,testutil; then
            echo "enclava-engine prod-strict unexpectedly accepted testutil"
            exit 1
          fi
          if cargo check --release -p enclava-init --features prod-strict,luks-integration; then
            echo "enclava-init prod-strict unexpectedly accepted luks-integration"
            exit 1
          fi

  browser-verifier:
    name: Test verifier in headless browser
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.118 --locked

      - name: Build web verifier
        run: ./web/verifier/build.sh

      - name: Run checked-in browser fixture
        run: |
          python3 -m http.server 8000 >/tmp/enclava-verifier-http.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/web/verifier/test.html >/dev/null && break
            sleep 1
          done
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=30000 \
            --dump-dom http://127.0.0.1:8000/web/verifier/test.html > /tmp/enclava-verifier-dom.html
          if ! grep -E '<pre id="result">PASS [0-9a-f]{64}</pre>' /tmp/enclava-verifier-dom.html; then
            cat /tmp/enclava-verifier-dom.html
            cat /tmp/enclava-verifier-http.log
            exit 1
          fi
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=30000 \
            --dump-dom 'http://127.0.0.1:8000/web/verifier/test.html?reject=measurement&expected=FAIL&reason=SNP_MEASUREMENT_REJECTED' \
            > /tmp/enclava-verifier-rejected-dom.html
          grep -E '<pre id="result">PASS [0-9a-f]{64}</pre>' /tmp/enclava-verifier-rejected-dom.html
          for vector in \
            'snp_report:SNP_REPORT_SIGNATURE_INVALID' \
            'sigstore_material:SUPPLY_CHAIN_SIGNATURE_INVALID' \
            'provenance_oci_material:SUPPLY_CHAIN_SIGNATURE_INVALID'; do
            field="${vector%%:*}"
            reason="${vector#*:}"
            google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=30000 \
              --dump-dom "http://127.0.0.1:8000/web/verifier/test.html?mutate=${field}&expected=FAIL&reason=${reason}" \
              > "/tmp/enclava-verifier-${field}-dom.html"
            grep -E '<pre id="result">PASS [0-9a-f]{64}</pre>' "/tmp/enclava-verifier-${field}-dom.html"
          done
