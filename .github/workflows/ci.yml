name: CI

on:
  push:
    branches: ["main", "develop"]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-cli:
    name: Build enclava CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            crt-static: -C target-feature=+crt-static
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.crt-static }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Full build (not check) so linking and all target triples are exercised
      # before a tag starts the release workflow. Mirrors the release targets,
      # including static CRT on Windows.
      - name: Build CLI
        run: cargo build --bin enclava --target ${{ matrix.target }}

      # Runtime coverage for platform-specific code (Windows ACL
      # create/verify roundtrip, unix permission checks) — a compiling
      # release must not be the first time these execute.
      # x86_64-apple-darwin test binaries execute via Rosetta 2 on the arm64
      # runner; split onto macos-latest-intel if that ever stops holding.
      - name: Run CLI unit tests
        run: cargo test -p enclava-cli --target ${{ matrix.target }}

  test:
    name: Test Rust workspace
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reject Rust source-text tests
        run: |
          python3 scripts/check-no-rust-source-tests.py --self-test
          python3 scripts/check-no-rust-source-tests.py

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libcryptsetup-dev clang libclang-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run fmt check
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        # Database-backed tests share one PostgreSQL service and exercise
        # intentionally global provider fences; enclava-cli, enclava-init,
        # and enclava-wait-exec also mutate process-global env or init
        # surface paths, so the whole suite stays serialized. Workspace
        # doctests run inside this selection, so no separate cargo test
        # --doc step is needed.
        run: cargo test --workspace -- --test-threads=1
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Run enclava-init prod-strict lib tests
        # Runs prod_strict_ignores_dev_no_luks_value against a debug build
        # (--release would disable debug_assertions and make the test vacuous):
        # proves the ENCLAVA_INIT_DEV_NO_LUKS gate is compiled out, not just
        # that the cfg string exists in source. Needs no DATABASE_URL.
        run: cargo test --locked -p enclava-init --lib --features prod-strict -- --test-threads=1

      - name: Run enclava-init prod-strict binary tests
        # Failure-path tests redirect init surfaces through the cfg(test)-only
        # override map (env vars are compiled out under prod-strict), so the
        # full binary suite must pass under prod-strict too.
        run: cargo test --locked -p enclava-init --bins --features prod-strict -- --test-threads=1

      - name: Run enclava-wait-exec prod-strict tests
        # Proves the readiness/started-dir env gates are compiled out of the
        # prod-strict wait-exec build (readiness handoff pinned to the
        # compiled defaults, mirroring enclava-init). Bin unit tests only:
        # the integration tests exercise the dev-build env-override behavior.
        run: cargo test --locked -p enclava-wait-exec --bins --features prod-strict -- --test-threads=1

      - name: Run appraiser API conformance
        run: |
          ENCLAVA_APPRAISER_BIND=127.0.0.1:18080 cargo run -q -p enclava-appraiser >/tmp/enclava-appraiser.log 2>&1 &
          appraiser_pid=$!
          trap 'kill "$appraiser_pid"' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/healthz >/dev/null && break
            sleep 1
          done
          python3 scripts/appraiser-conformance.py http://127.0.0.1:18080

  dependency-gates:
    name: Audit Rust dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install cargo audit and cargo deny
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Check audit/deny ignore lockstep
        # deny.toml is the single source of truth; this fails if the ci.yml
        # cargo audit ignores ever diverge from it.
        run: bash scripts/check-audit-lockstep.sh

      - name: Run cargo audit
        # Ignore list is generated from deny.toml [advisories] so the two
        # dependency gates can never diverge on which advisories are
        # accepted (lockstep enforced by the step above).
        run: cargo audit $(bash scripts/cargo-audit-args.sh)

      - name: Run cargo deny
        run: cargo deny check advisories sources

  supply-chain:
    name: Supply-chain hygiene (issue #140)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify vendored rdrand delta against the reviewed patch
        run: bash scripts/verify-vendored-rdrand.sh

      - name: Verify bundled sigstore trust root pin
        run: bash scripts/verify-sigstore-trust-root.sh

  build:
    name: Build all crates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libcryptsetup-dev clang libclang-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build workspace
        run: cargo build --workspace

      - name: Build release bins
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          cargo build --release --bin enclava-api
          cargo build --release --bin enclava

      - name: Verify strict builds reject the committed fixture bundle
        run: |
          if cargo check --locked -p enclava-common --features release-profiles,prod-strict > /tmp/profile-fixture.log 2>&1; then
            cat /tmp/profile-fixture.log
            exit 1
          fi
          grep -q "prod-strict must not trust the committed fixture root" /tmp/profile-fixture.log

      - name: Materialize and verify approved common profiles
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          ENCLAVA_PLATFORM_RELEASE_PROFILES_JSON: ${{ secrets.ENCLAVA_PLATFORM_RELEASE_PROFILES_JSON }}
        run: |
          test -n "$ENCLAVA_PLATFORM_RELEASE_PROFILES_JSON"
          printf '%s' "$ENCLAVA_PLATFORM_RELEASE_PROFILES_JSON" > crates/enclava-common/platform-release-profiles.json
          cargo run --locked --release -p enclava-cli --example platform-release -- verify-profiles \
            crates/enclava-common/platform-release-profiles.json

      - name: Build prod-strict release path
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          cargo build --release -p enclava-common --features prod-strict
          cargo build --release -p enclava-engine --features prod-strict
          cargo build --release -p enclava-api --features prod-strict
          cargo build --release -p enclava-cli --features prod-strict
          cargo build --release -p enclava-init --features prod-strict

      - name: Verify prod-strict rejects debug-only features
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          if cargo check --release -p enclava-engine --features prod-strict,testutil; then
            echo "enclava-engine prod-strict unexpectedly accepted testutil"
            exit 1
          fi
          if cargo check --release -p enclava-init --features prod-strict,luks-integration; then
            echo "enclava-init prod-strict unexpectedly accepted luks-integration"
            exit 1
          fi

  generator-tests:
    name: Run platform-release generator tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install generator dependencies
        run: pip install -r crates/enclava-cli/scripts/requirements.txt pytest

      - name: Run generator tests
        run: python -m pytest tests/test_generate_platform_release.py -v

  browser-verifier:
    name: Test verifier in headless browser
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install matching wasm-bindgen CLI
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: wasm-bindgen-cli@0.2.118
          fallback: none

      - name: Build web verifier
        run: ./web/verifier/build.sh

      - name: Run checked-in browser fixture
        run: |
          python3 -m http.server 8000 >/tmp/enclava-verifier-http.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/web/verifier/test.html >/dev/null && break
            sleep 1
          done
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=30000 \
            --dump-dom http://127.0.0.1:8000/web/verifier/test.html > /tmp/enclava-verifier-dom.html
          if ! grep -E '<pre id="result">PASS [0-9a-f]{64}</pre>' /tmp/enclava-verifier-dom.html; then
            cat /tmp/enclava-verifier-dom.html
            cat /tmp/enclava-verifier-http.log
            exit 1
          fi
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=30000 \
            --dump-dom 'http://127.0.0.1:8000/web/verifier/test.html?reject=measurement&expected=FAIL&reason=SNP_MEASUREMENT_REJECTED' \
            > /tmp/enclava-verifier-rejected-dom.html
          grep -E '<pre id="result">PASS [0-9a-f]{64}</pre>' /tmp/enclava-verifier-rejected-dom.html
          for vector in \
            'snp_report:SNP_REPORT_SIGNATURE_INVALID' \
            'sigstore_material:SUPPLY_CHAIN_SIGNATURE_INVALID' \
            'provenance_oci_material:SUPPLY_CHAIN_SIGNATURE_INVALID'; do
            field="${vector%%:*}"
            reason="${vector#*:}"
            google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=30000 \
              --dump-dom "http://127.0.0.1:8000/web/verifier/test.html?mutate=${field}&expected=FAIL&reason=${reason}" \
              > "/tmp/enclava-verifier-${field}-dom.html"
            grep -E '<pre id="result">PASS [0-9a-f]{64}</pre>' "/tmp/enclava-verifier-${field}-dom.html"
          done

      - name: Assert panic isolation on the real wasm target
        # cap#141 review: wasm32-unknown-unknown uses the abort panic
        # strategy, so catch_unwind alone cannot convert a panic into a
        # JsError in the shipped module. Prove on the real target that a
        # panic traps into a catchable JS exception and the instance stays
        # usable — using a test-only probe feature, never in the release
        # build.
        run: |
          rustup run stable cargo build -p enclava-verifier-wasm --release --target wasm32-unknown-unknown \
            --features debug-panic-probe
          wasm-bindgen --target web --out-dir web/verifier/pkg \
            target/wasm32-unknown-unknown/release/enclava_verifier_wasm.wasm
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=30000 \
            --dump-dom http://127.0.0.1:8000/web/verifier/panic-test.html \
            > /tmp/enclava-verifier-panic-dom.html
          cat /tmp/enclava-verifier-panic-dom.html
          grep -E '<pre id="result">PASS panic-isolated</pre>' /tmp/enclava-verifier-panic-dom.html
