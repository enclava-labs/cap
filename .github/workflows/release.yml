name: Release

on:
  push:
    tags: ['v*']

env:
  ENCLAVA_PLATFORM_RELEASE_ROOT_PUBKEY_HEX: 5b9437adeaffbe8f41b13d96ed49d2f51cd6c266cd8ecc284b0552ec4912b8dd

jobs:
  build-linux:
    name: Build Linux binaries
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: linux
            arch: x86_64
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: |
          cargo build --release --bin enclava --target ${{ matrix.target }}

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf enclava-${{ matrix.os }}-${{ matrix.arch }}.tar.gz enclava

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: enclava-${{ matrix.os }}-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/enclava-*.tar.gz

  build-windows:
    name: Build Windows binaries
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Vendored OpenSSL builds with no-asm automatically when nasm is absent.
      - name: Build binary
        run: cargo build --release --bin enclava --target x86_64-pc-windows-msvc

      - name: Package binary
        run: |
          cd target/x86_64-pc-windows-msvc/release
          tar czf enclava-windows-x86_64.tar.gz enclava.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: enclava-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/enclava-windows-x86_64.tar.gz

  build-macos:
    name: Build macOS binaries
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos
            arch: x86_64
          - target: aarch64-apple-darwin
            os: macos
            arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: |
          cargo build --release --bin enclava --target ${{ matrix.target }}

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf enclava-${{ matrix.os }}-${{ matrix.arch }}.tar.gz enclava

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: enclava-${{ matrix.os }}-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/enclava-*.tar.gz

  build-web-verifier:
    name: Build local HTML/WASM verifier
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.118 --locked

      - name: Build deterministic web release
        run: ./web/verifier/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: enclava-verifier-web
          path: |
            web/verifier/release/enclava-verifier-web.tar.gz
            web/verifier/release/SHA256SUMS
            web/verifier/release/example-policy.json

  release:
    name: Create GitHub release
    needs: [build-linux, build-macos, build-windows, build-web-verifier]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum */*.tar.gz > SHA256SUMS.txt

      - uses: sigstore/cosign-installer@v3.9.2

      - name: Sign independently pinnable web verifier
        run: |
          cosign sign-blob --yes \
            --bundle artifacts/enclava-verifier-web/enclava-verifier-web.tar.gz.sigstore.json \
            artifacts/enclava-verifier-web/enclava-verifier-web.tar.gz
          cosign sign-blob --yes \
            --bundle artifacts/enclava-verifier-web/example-policy.json.sigstore.json \
            artifacts/enclava-verifier-web/example-policy.json

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*/*.tar.gz
            artifacts/enclava-verifier-web/example-policy.json
            artifacts/enclava-verifier-web/*.sigstore.json
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
