contract: cap-paas-internal-logs
version: 1
owner: enclava-paas
consumer: cap
route:
  method: GET
  path: /internal/paas/orgs/{paas_org_id}/apps/{app_name}/logs
auth:
  service_token: required
  mtls_client_identity: required
  actor_header: x-enclava-paas-user-id
query:
  follow:
    type: boolean
    default: false
  tail_lines:
    type: integer
    min: 1
    max: 1000
    defaults:
      follow_false: 200
      follow_true: 100
  since_seconds:
    type: integer
    min: 1
    max:
      follow_false: 86400
      follow_true: 3600
  container:
    type: kubernetes-container-name
authorization:
  cap_actor_roles:
    - owner
    - admin
  denied_role_code: scope_not_allowed
  entitlement_source: synced_paas_entitlement
responses:
  encrypted_log_stream:
    status: 200
    content_type: application/x-ndjson
    headers:
      cache_control: no-store
      x_enclava_log_format: encrypted-jsonl; version=enclava-log-frame-v1
    body: newline-delimited EncryptedLogFrame JSON objects
    reason: CAP brokers ciphertext produced inside the confidential workload boundary
    plaintext: forbidden
  encrypted_logs_required:
    status: 501
    code: encrypted_logs_required
    content_type: application/json
    body: Error
    reason: latest deployment has no tenant-controlled log encryption metadata
  errors:
    "400": invalid_log_query
    "403": scope_not_allowed
    "404": app_not_found
    "409": logs_not_ready
    "501": encrypted_logs_required
    "502": encrypted_log_stream_unavailable
security:
  log_bodies_are_sensitive: true
  cache_control: no-store
  encrypted_log_format: encrypted-jsonl; version=enclava-log-frame-v1
  ciphertext_brokerage_only: true
  plaintext_kubernetes_logs: forbidden
  cap_or_paas_plaintext_access: forbidden
  tenant_client_decrypts: required
  audit_log_bodies: forbidden
schemas:
  EncryptedLogFrame:
    required:
      - version
      - algorithm
      - key_id
      - org_id
      - app_name
      - deployment_id
      - recipient_public_key_sha256
      - sender_public_key_base64url
      - nonce_base64url
      - sequence
      - stream
      - container
      - timestamp
      - ciphertext_base64url
    properties:
      version: enclava-log-frame-v1
      algorithm: x25519-hpke-v1
      key_id: tenant-selected public log key id
      org_id: tenant organization identifier bound into frame AEAD
      app_name: hosted app name bound into frame AEAD
      deployment_id: CAP deployment id bound into frame AEAD
      recipient_public_key_sha256: tenant public key hash
      sender_public_key_base64url: ephemeral sender public key
      nonce_base64url: per-frame nonce
      sequence: monotonically increasing frame sequence
      stream: stdout or stderr
      container: workload container name
      timestamp: RFC3339 frame timestamp
      ciphertext_base64url: encrypted log line bytes
  Error:
    required:
      - message
      - code
    properties:
      code: encrypted_logs_required
      message: human-readable fail-closed explanation
