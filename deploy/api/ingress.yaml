apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enclava-api
  namespace: enclava-platform
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Rate-limit annotation applies to the entire / prefix; see ingress.yaml
    # below for the tighter /auth/device/start limit.
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.enclava.dev
    secretName: api-tls
  rules:
  - host: api.enclava.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: enclava-api
            port:
              number: 80
---
# Separate Ingress for the tight device-start rate limit. ingress-nginx
# applies annotations to the Ingress's path prefix, so a single / would
# throttle login polling, approvals, and unrelated API traffic. This exact-
# path Ingress isolates the 1 r/s burst-10 limit to only /auth/device/start.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enclava-api-device-start
  namespace: enclava-platform
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "1"
    # This is per ingress controller replica; with N replicas the effective
    # limit is N r/s. Size accordingly or use a cluster-wide store if the
    # target cluster runs multiple ingress-nginx controllers.
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.enclava.dev
    secretName: api-tls
  rules:
  - host: api.enclava.dev
    http:
      paths:
      - path: /auth/device/start
        pathType: Exact
        backend:
          service:
            name: enclava-api
            port:
              number: 80
