apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cap-api-platform-release-state
  namespace: enclava-platform
  labels:
    app.kubernetes.io/name: cap-api
spec:
  # The platform-release override high-water mark (ENCLAVA_PLATFORM_RELEASE_
  # STATE) must survive pod replacement, so an emptyDir would silently reset
  # the anti-rollback floor. ReadWriteMany because the base deployment runs
  # 2 replicas that serialize on the same mark + flock; single-replica
  # overlays may relax this to ReadWriteOnce. Overlays without a default
  # StorageClass must set spec.storageClassName explicitly.
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 16Mi
