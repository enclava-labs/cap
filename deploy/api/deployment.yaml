apiVersion: apps/v1
kind: Deployment
metadata:
  name: enclava-api
  namespace: enclava-platform
spec:
  replicas: 2
  # Deterministic config-token receipts can be replayed for five minutes.
  # Never mix binaries with different receipt/signing contracts in that live
  # window; see runbooks/paas-config-token-idempotency.md.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: enclava-api
  template:
    metadata:
      labels:
        app: enclava-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: ghcr.io/enclava-labs/enclava-api:latest
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 3000
          name: http
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: database-url
        # This value lives outside Postgres and must increase before restoring
        # a database backup. CAP rotates its runtime authority epoch when it
        # advances and refuses startup if a rollout moves it backwards.
        - name: CAP_DATABASE_RESTORE_GENERATION
          value: "1"
        - name: API_URL
          value: "https://api.enclava.dev"
        - name: PLATFORM_DOMAIN
          value: "enclava.dev"
        - name: DNS_MANAGEMENT_REQUIRED
          value: "true"
        - name: CLOUDFLARE_ZONE_NAME
          value: "enclava.dev"
        - name: TENANT_HAPROXY_ENABLED
          value: "false"
        # Deployment acceptance/dispatch is an independent activation gate.
        # Keep it false during migration and provider cleanup; enable it only
        # after rollout receipts and smoke tests have passed.
        - name: CAP_DEPLOYMENT_DISPATCH_ENABLED
          value: "false"
        - name: CLOUDFLARE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: cloudflare-api-token
        - name: TENANT_DNS_TARGET
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: tenant-dns-target
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        # Allow up to 30 minutes for migrations and runtime-authority setup
        # before the startup-safe listener exists. Once /livez succeeds,
        # liveness remains independent from provider/API readiness.
        startupProbe:
          httpGet:
            path: /livez
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 180
        livenessProbe:
          httpGet:
            path: /livez
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
      imagePullSecrets:
      - name: ghcr-login
      volumes:
      - name: tmp
        emptyDir: {}
