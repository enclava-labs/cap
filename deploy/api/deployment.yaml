apiVersion: apps/v1
kind: Deployment
metadata:
  name: enclava-api
  namespace: enclava-platform
  labels:
    app.kubernetes.io/name: cap-api
spec:
  replicas: 2
  # Deterministic config-token receipts can be replayed for five minutes.
  # Never mix binaries with different receipt/signing contracts in that live
  # window; see runbooks/paas-config-token-idempotency.md.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: enclava-api
  template:
    metadata:
      labels:
        app: enclava-api
        app.kubernetes.io/name: cap-api
    spec:
      serviceAccountName: enclava-api
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: ghcr.io/enclava-labs/enclava-api:latest
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 3000
          name: http
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        env:
        # Rate-limit keying behind the ingress: the peer address seen by
        # the API pod is the ingress-nginx controller's pod/node IP, not the
        # client. Without a trusted CIDR the extractor falls back to that
        # shared address and every public client lands in one rate-limit
        # bucket. 10.0.0.0/8 covers the cluster pod network; header trust
        # is made safe in combination with three controls:
        #   1. deploy/api/network-policy.yaml, which restricts API ingress
        #      to the ingress-nginx controllers, the enclava-paas internal
        #      caller, and tenant workload pods only;
        #   2. TRUSTED_PROXY_SECRET (below) — required because the tenant
        #      and PaaS pods that policy admits sit INSIDE 10.0.0.0/8, so
        #      CIDR membership alone would let them rotate X-Real-IP/XFF to
        #      mint fresh rate-limit buckets on direct ClusterIP calls.
        #      With the secret set, forwarding headers are honoured only
        #      from peers that also present it; the ingress controllers
        #      inject it via their proxy-set-headers ConfigMap, so only
        #      they qualify. Direct pod callers are keyed by pod IP.
        #   3. the extractor's rightmost-untrusted XFF walk, which ignores
        #      client-spoofed leftmost entries.
        # Narrow the CIDR to the ingress-nginx controller's subnet per
        # target cluster where that is known.
        - name: TRUSTED_PROXY_CIDRS
          value: "10.0.0.0/8"
        - name: TRUSTED_PROXY_SECRET
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: trusted-proxy-secret
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: database-url
        - name: DATABASE_MIGRATION_MODE
          value: verify
        # Keep false through migration, clean-cut proof, provider convergence,
        # and smoke tests. Enable only in a later activation rollout.
        - name: CAP_DEPLOYMENT_DISPATCH_ENABLED
          value: "false"
        - name: API_URL
          value: "https://api.enclava.dev"
        - name: AMD_KDS_BASE_URL
          value: "http://amd-kds-relay.enclava-platform.svc.cluster.local:8080/vcek/v1"
        - name: PLATFORM_DOMAIN
          value: "enclava.dev"
        - name: DNS_MANAGEMENT_REQUIRED
          value: "true"
        - name: CLOUDFLARE_ZONE_NAME
          value: "enclava.dev"
        - name: CLOUDFLARE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: cloudflare-api-token
        - name: TENANT_DNS_TARGET
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: tenant-dns-target
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /livez
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 180
        livenessProbe:
          httpGet:
            path: /livez
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
      imagePullSecrets:
      - name: ghcr-login
      volumes:
      - name: tmp
        emptyDir: {}
