[workspace]
resolver = "2"
members = [
    "crates/enclava-common",
    "crates/enclava-engine",
    "crates/enclava-api",
    "crates/enclava-appraiser",
    "crates/enclava-cli",
    "crates/enclava-init",
    "crates/enclava-verifier",
    "crates/enclava-verifier-wasm",
    "crates/enclava-wait-exec",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[profile.release]
strip = true

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
sha2 = { version = "0.10", features = ["oid"] }
hex = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
k8s-openapi = { version = "0.27", features = ["v1_35"] }
kube = { version = "3.1", features = ["runtime", "client", "derive", "rustls-tls", "aws-lc-rs"] }
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
tracing = "0.1"
serde_yaml = "0.9"
base64 = "0.22"
data-encoding = "2"
flate2 = "1.0"
axum = { version = "0.8", features = ["macros"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "derive", "migrate", "macros"] }
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
tower = "0.5"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
nostr = "0.44.7"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
dialoguer = "0.11"
indicatif = "0.17"
dirs = "6"
colored = "3"
tokio-util = { version = "0.7", features = ["io"] }
hmac = "0.12"
subtle = "2"
tower_governor = "0.8"
sigstore = { version = "0.14", default-features = false, features = ["cosign", "sigstore-trust-root", "rustls-tls", "verify"] }
oci-client = { version = "0.17", default-features = false, features = ["rustls-tls"] }
hickory-resolver = { version = "0.26.1", default-features = false, features = ["tokio", "system-config"] }
zeroize = { version = "1", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
tokio-rustls = "0.26"
x509-cert = "0.2"
url = "2"
p384 = { version = "0.13", default-features = false, features = ["alloc", "ecdsa", "pkcs8"] }
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
pkcs1 = { version = "0.7", features = ["std"] }

# Internal
enclava-common = { path = "crates/enclava-common" }
enclava-verifier = { path = "crates/enclava-verifier" }
enclava-engine = { path = "crates/enclava-engine" }
