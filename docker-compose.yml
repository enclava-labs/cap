# Development-only compose file.
# Credentials below are placeholders — do not use in any deployed environment.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: enclava
      POSTGRES_PASSWORD: enclava
      POSTGRES_DB: enclava
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: crates/enclava-api/Dockerfile
      args:
        # Local-compose-only well-known fixture; must never be a Dockerfile default.
        ENCLAVA_PLATFORM_RELEASE_ROOT_PUBKEY_HEX: 5b9437adeaffbe8f41b13d96ed49d2f51cd6c266cd8ecc284b0552ec4912b8dd
    environment:
      DATABASE_URL: postgresql://enclava:enclava@postgres:5432/enclava
      API_URL: http://localhost:3000
      PLATFORM_DOMAIN: enclava.local
      ALLOW_EPHEMERAL_KEYS: "1"
      CAP_DISABLE_EDGE_RECONCILIATION: "true"
      CAP_DEPLOYMENT_DISPATCH_ENABLED: "false"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
