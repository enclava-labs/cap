# Development-only compose file.
# Credentials below are placeholders — do not use in any deployed environment.
services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: enclava
      POSTGRES_PASSWORD: enclava
      POSTGRES_DB: enclava
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: crates/enclava-api/Dockerfile
      # Only the non-release stage accepts the committed local trust profiles.
      target: runtime-debug
    environment:
      DATABASE_URL: postgresql://enclava:enclava@postgres:5432/enclava
      API_URL: http://localhost:3000
      ENCLAVA_PLATFORM_RELEASE_PROFILE: dev
      PLATFORM_DOMAIN: enclava.local
      ALLOW_EPHEMERAL_KEYS: "1"
      CAP_DISABLE_EDGE_RECONCILIATION: "true"
      CAP_DEPLOYMENT_DISPATCH_ENABLED: "false"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
