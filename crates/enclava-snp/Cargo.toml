[package]
name = "enclava-snp"
version = "0.1.0"
edition.workspace = true

[dependencies]
base64 = { workspace = true }
enclava-verifier = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { version = "1", features = ["net", "sync", "time"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
webpki-root-certs = "1"
x509-cert = { workspace = true }
# Structured CoCo report parsing and KDS lookup identity only. AMD chain and
# report verification run on enclava-verifier, so no sev crypto backend is
# enabled; that keeps OpenSSL out of consumers that never needed it.
sev = { version = "7.1.0", default-features = false, features = ["snp", "serde"] }

[dev-dependencies]
axum = { workspace = true }
enclava-common = { workspace = true }
futures = { workspace = true }
rcgen = "0.14"
tempfile = "3"
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
