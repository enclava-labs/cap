[package]
name = "enclava-api"
version = "0.1.0"
edition.workspace = true

[lib]
name = "enclava_api"
path = "src/lib.rs"

[[bin]]
name = "enclava-api"
path = "src/main.rs"

[[bin]]
name = "migrate-two-hostnames"
path = "src/bin/migrate_two_hostnames.rs"

[[bin]]
name = "cap-migrate"
path = "src/bin/cap_migrate.rs"

[dependencies]
anyhow = { workspace = true }
enclava-engine = { workspace = true }
enclava-common = { workspace = true, features = ["outbound-http", "release-profiles"] }
tokio = { workspace = true }
axum = { workspace = true }
sqlx = { workspace = true }
jsonwebtoken = { workspace = true }
futures = { workspace = true }
ed25519-dalek = { workspace = true }
argon2 = { workspace = true }
reqwest = { workspace = true }
tower-http = { workspace = true }
tower = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
base64 = { workspace = true }
data-encoding = { workspace = true }
nostr = { workspace = true }
hmac = { workspace = true }
subtle = { workspace = true }
tower_governor = { workspace = true }
sigstore-verify = { workspace = true }
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "pkcs8"] }
jiff = { workspace = true }
oci-client = { workspace = true }
hickory-resolver = { workspace = true }
k8s-openapi = { workspace = true }
enclava-verifier = { workspace = true }
enclava-snp = { workspace = true }
kube = { workspace = true }
instant-acme = "0.8"
rustls = { workspace = true }
http = "1"
http-body-util = "0.1"
httpdate = "1"
bytes = "1"
tokio-rustls = { workspace = true }

[features]
prod-strict = ["enclava-engine/prod-strict", "enclava-common/prod-strict"]

[dev-dependencies]
axum-test = "20"
tower = { version = "0.5", features = ["util"] }
rcgen = "0.14"
# Anchor sync guard: the API's builtin ARK pins (enclava-snp) must stay the
# roots the CLI gets from sev. `openssl` matches enclava-cli's sev features so
# the vendored OpenSSL build unifies.
sev = { version = "7.1.0", default-features = false, features = ["snp", "openssl"] }
# start_paused for the pull-secret cleanup tests: the delete conflict backoff
# (~60 s budget) and the finalizer poll (30 s) run in simulated time.
tokio = { version = "1", features = ["full", "test-util"] }
