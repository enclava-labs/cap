[package]
name = "enclava-api"
version = "0.1.0"
edition.workspace = true

[lib]
name = "enclava_api"
path = "src/lib.rs"

[[bin]]
name = "enclava-api"
path = "src/main.rs"

[[bin]]
name = "migrate-two-hostnames"
path = "src/bin/migrate_two_hostnames.rs"

[[bin]]
name = "cap-migrate"
path = "src/bin/cap_migrate.rs"

[dependencies]
anyhow = { workspace = true }
enclava-engine = { workspace = true }
enclava-common = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
sqlx = { workspace = true }
jsonwebtoken = { workspace = true }
futures = { workspace = true }
ed25519-dalek = { workspace = true }
argon2 = { workspace = true }
reqwest = { workspace = true }
tower-http = { workspace = true }
tower = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
base64 = { workspace = true }
data-encoding = { workspace = true }
nostr = { workspace = true }
hmac = { workspace = true }
subtle = { workspace = true }
tower_governor = { workspace = true }
sigstore = { workspace = true }
oci-client = { workspace = true }
hickory-resolver = { workspace = true }
k8s-openapi = { workspace = true }
kube = { workspace = true }
instant-acme = "0.8"
rustls = { workspace = true }
http = "1"
http-body-util = "0.1"
httpdate = "1"
bytes = "1"
fd-lock = "4.0.4"

[features]
prod-strict = ["enclava-engine/prod-strict"]

[dev-dependencies]
axum-test = "20"
tower = { version = "0.5", features = ["util"] }
# Test-only mirror of the router's matcher: the freeze-gate invariant test
# asserts gate classification matches matchit dispatch. Pinned =0.8.4 so a
# cargo update can never silently move the mirror off the semantics the
# router uses; the test also asserts Cargo.lock holds exactly one matchit.
# Re-verify matcher semantics on ANY bump (patch included) — see the
# classifier invariant comment in src/lib.rs.
matchit = "=0.8.4"
