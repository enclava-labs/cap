[package]
name = "enclava-cli"
version = "0.1.1"
edition.workspace = true

[lib]
name = "enclava_cli"
path = "src/lib.rs"

[[bin]]
name = "enclava"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
enclava-common = { workspace = true, features = ["outbound-http", "release-profiles"] }
enclava-verifier = { path = "../enclava-verifier" }
enclava-engine = { path = "../enclava-engine" }
tokio = { workspace = true }
clap = { workspace = true, features = ["env"] }
toml = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dialoguer = { workspace = true }
indicatif = { workspace = true }
dirs = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
colored = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
nostr = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
zeroize = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
x509-cert = { workspace = true }
sev = { version = "7.1.0", default-features = false, features = ["snp", "openssl", "serde"] }
fd-lock = "4.0.4"
tempfile = "3"

# Vendor OpenSSL everywhere (sev's AMD chain verification needs it): static
# musl builds, Windows/macOS CI runners, and cross-checks all lack a usable
# system OpenSSL. Feature-unifies with sev's `openssl` usage.
openssl = { version = "0.10", features = ["vendored"] }

# Owner-only security descriptors for secret files/dirs (already in the
# workspace graph transitively; no new crate).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[features]
prod-strict = ["enclava-common/prod-strict"]

[dev-dependencies]
enclava-engine = { path = "../enclava-engine", features = ["testutil"] }
parking_lot = "0.12"
tokio = { workspace = true, features = ["test-util"] }
