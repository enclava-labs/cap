[package]
name = "enclava-vault"
version = "0.1.0"
edition = { workspace = true }
rust-version = { workspace = true }

[[bin]]
name = "enclava-vault"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
bytes = "1"
clap = { workspace = true, features = ["env"] }
enclava-common = { workspace = true, features = ["outbound-http"] }
hex = { workspace = true }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "server-auto", "tokio"] }
nix = { version = "0.29", features = ["process"] }
percent-encoding = "2"
rand = { workspace = true }
rcgen = "0.14"
rustls = { workspace = true }
rustls-pki-types = "1"
serde = { workspace = true }
thiserror = { workspace = true }
time = "0.3"
tokio = { workspace = true }
tokio-rustls = { workspace = true }
toml = { workspace = true }
tower-service = "0.3"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
webpki-roots = "1"
zeroize = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true, features = ["http2"] }
tempfile = "3"
